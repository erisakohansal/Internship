    - trainer.n_gpus_per_node=4
    - trainer.validation_data_dir=/project/home/p201382/erisa/Multi-Domain-RL/mcqa/checkpoints/Validation
    - trainer.log_val_generations=8
    - trainer.resume_mode=disable
