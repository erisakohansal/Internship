    - trainer.total_training_steps=10
    - trainer.save_freq=5
    - trainer.val_before_train=True
    - trainer.test_freq=5
    - trainer.default_local_dir=/project/home/p201382/erisa/Multi-Domain-RL/mcqa/checkpoints
    - trainer.project_name=multi_domain_rl
    - trainer.experiment_name=mcqa
    - trainer.logger=["wandb"]
